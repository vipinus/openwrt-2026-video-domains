name: Sync gfwlist

# Track https://github.com/gfwlist/gfwlist and refresh gfwlist.txt whenever the
# upstream list changes. Upstream ships base64-encoded AutoProxy rules; we
# convert them to a plain domain list the firmware can feed to dnsmasq.
#
# Upstream declares `Expires: 6h`, so a daily check is plenty.

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert upstream list
        id: convert
        run: |
          set -euo pipefail
          python3 tools/gfwlist2domains.py > /tmp/upstream.txt

          # Merge the curated additions, then collapse again so a sub-domain
          # whose parent arrived upstream does not linger.
          python3 - <<'PY'
          import re
          up = {l.strip() for l in open("/tmp/upstream.txt") if l.strip()}
          extra = {l.strip() for l in open("gfwlist-extra.txt")
                   if l.strip() and not l.startswith("#")}
          all_d = up | extra
          keep = []
          for d in sorted(all_d):
              p = d.split(".")
              if any(".".join(p[i:]) in all_d for i in range(1, len(p))):
                  continue
              keep.append(d)
          open("/tmp/merged.txt", "w").write("\n".join(keep) + "\n")
          print(f"upstream={len(up)} extra={len(extra)} merged={len(keep)}")
          PY

          # Second output, same source: AutoProxy rules for the browser proxy
          # extension. Generated here rather than in a separate job so the two
          # consumers can never drift apart by a day.
          python3 tools/gfwlist2autoproxy.py > /tmp/autoproxy.txt

          CNT=$(grep -cE '^[a-z0-9][a-z0-9.-]*$' /tmp/merged.txt)
          echo "count=${CNT}" >> "$GITHUB_OUTPUT"

          # Gate: the firmware refuses anything under 1000 entries, so never
          # publish a file that would be rejected on the far end anyway.
          if [ "$CNT" -lt 1000 ]; then
              echo "only ${CNT} domains — refusing to publish"
              exit 1
          fi

      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          {
            echo "# 被墙域名清单（gfwlist）。每行一个域名，# 开头与空行忽略。"
            echo "# 自动生成：上游 https://github.com/gfwlist/gfwlist + gfwlist-extra.txt"
            echo "# 由 .github/workflows/gfwlist-sync.yml 每日同步，别手改这个文件。"
            echo "# 要加自己的域名请改 gfwlist-extra.txt。"
            cat /tmp/merged.txt
          } > gfwlist.txt

          cp /tmp/autoproxy.txt gfwlist-autoproxy.txt

          if git diff --quiet -- gfwlist.txt gfwlist-autoproxy.txt; then
              echo "no change"
              echo "changed=0" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gfwlist.txt gfwlist-autoproxy.txt
          git commit -m "chore(gfwlist): sync — ${{ steps.convert.outputs.count }} domains"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"

      # 统一走监控系统的入口（mon.anyfq.com/notify → Alertmanager → Discord + Telegram）。
      # 站长 2026-10-05：这条以前直发 Discord，Telegram 收不到。入口不通时退回直发 Discord，消息不丢。
      # 只在有变化和失败时发；没有变化不发。
      - name: Notify
        if: always()
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          CHG="${{ steps.commit.outputs.changed }}"
          CNT="${{ steps.convert.outputs.count }}"
          SEV=info
          if [ "${{ job.status }}" = "success" ] && [ "$CHG" = "1" ]; then
              MSG="✅ gfwlist synced: ${CNT} domains"
          elif [ "${{ job.status }}" = "success" ]; then
              # 没有变化不通知（站长 2026-10-05：只在「有变化」和「失败」时才通知，天天一条「no change」会让人忽略真正的告警）
              echo "no change — 不发通知"; exit 0
          else
              MSG="🚨 gfwlist sync FAILED (${{ github.run_id }})"; SEV=warning
          fi
          BODY=$(jq -nc --arg t "$MSG" --arg s "$SEV" '{title:$t, text:"", severity:$s, source:"github-actions"}')
          OK=0
          if [ -n "$NOTIFY_TOKEN" ]; then
              for U in https://mon.anyfq.com/notify https://mon.fanq.in/notify; do
                  R=$(curl -s -m 20 -X POST "$U" -H "Authorization: Bearer $NOTIFY_TOKEN" -H 'Content-Type: application/json' \
                           -A 'Mozilla/5.0 sysnotify' -d "$BODY" || true)
                  if echo "$R" | jq -e '.ok == true' >/dev/null 2>&1; then OK=1; break; fi
              done
          fi
          if [ "$OK" != 1 ]; then
              echo "统一入口不通，退回直发 Discord"
              curl -s -X POST -H 'Content-Type: application/json' \
                   -d "$(jq -nc --arg c "$MSG" '{content:$c}')" "$DISCORD_WEBHOOK" || true
          fi
